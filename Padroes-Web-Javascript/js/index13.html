<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=3, initial-scale=1.0" />
        <title>JavaScript</title>
        <style>
            .alerta {
                color: #fff;
                background-color: #f00;
            }
        </style>
        <script
            src="https://code.jquery.com/jquery-4.0.0.min.js"
            integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
            crossorigin="anonymous"
        ></script>
        <script>
            $(document).ready(function () {
                let listaIds = $('p')
                    .map(function () {
                        return $(this).attr('id');
                    })
                    .get();
                console.log(listaIds.join(', '));
            });
        </script>
    </head>
    <body>
        <h1>jQuery Manipulado Filtros</h1>
        <div>
            <p id="p1">Primeiro paragrafo</p>
            <p id="p2">Segundo paragrafo</p>
            <p id="p3">Terceiro paragrafo</p>
            <p id="p4">Quarto paragrafo</p>
            <p id="p5">Quinto paragrafo</p>
        </div>
    </body>
</html>
