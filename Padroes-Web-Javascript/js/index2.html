<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>JavaScritp</title>
        <script>
            onload = () => {
                nome.onblur = () => {
                    if (nome.value == '') {
                        nome_erro.innerHTML = '!';
                        nome.style.backgroundColor = '#F88';
                    } else {
                        nome_erro.innerHTML = '';
                        nome.style.backgroundColor = '#FFF';
                    }
                };

                if (nome.value != '' && senha.value != '')
                    btnsubmit.disabled = false;
                else btnsubmit.disabled = true;

                senha.onblur = () => {
                    if (senha.value == '') {
                        senha_erro.innerHTML = '!';
                        senha.style.backgroundColor = '#F88';
                    } else {
                        senha_erro.innerHTML = '';
                        senha.style.backgroundColor = '#FFF';
                    }
                };

                if (nome.value != '' && senha.value != '')
                    btnsubmit.disabled = false;
                else btnsubmit.disabled = true;
            };

            login.onsubmit = () => {
                if (nome.value == '' || senha.value == '') {
                    alert('Os campos nome e senhas são obrigatorios');
                    return false;
                }
                return true;
            };
        </script>
    </head>
    <body>
        <h1>JavaScript</h1>
        <h2>Utiliznado formulario</h2>
        <form id="login" action="login.html">
            <p>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" />
                <samp id="nome_erro"></samp>
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" />
            </p>
            <p>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" />
                <samp id="senha_erro"></samp>
            </p>
            <p>
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" />
            </p>
            <p>
                <label for="data">Data:</label>
                <input type="date" id="data" name="data" />
            </p>
            <p>
                <button id="btnsubmit" type="submit" disabled>Entrar</button>
            </p>
        </form>
    </body>
</html>
