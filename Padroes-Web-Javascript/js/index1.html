<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Olá Mundo!</title>
        <script>
            window.onload = () => {
                let button = document.getElementById('bt');
                button.innerHTML = '<strong>Olá mundo!</strong>';
                button.style.backgroundColor = '#D0D0FF';
                button.style.height = '8m';
                button.onclick = () => alert('Ola Mundo!');
            };
        </script>
    </head>
    <body>
        <p>
            <button id="">Olá</button>
        </p>
    </body>
</html>
