<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SVG</title>
        <link href="grafico.css" rel="stylesheet" />
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script src="grafico.js"></script>
        <script>
            onload = () => {
                let dados = [
                    { chave: 'Frango', valor: 56 },
                    { chave: 'Carne', valor: 73 },
                    { chave: 'Vegetariano', valor: 20 },
                    { chave: 'Queijo', valor: 115 },
                    { chave: 'Goiabada', valor: 44 },
                    { chave: 'Banana', valor: 60 },
                    { chave: 'Calabresa', valor: 33 },
                ];
                grafico({
                    seletor: '#grafico',
                    dados: dados,
                    largura: 600,
                    altura: 400,
                    tituloX: 'Tipos de pastéis',
                    tituloY: 'Quantidade diária',
                });
            };
        </script>
    </head>
    <body>
        <h1>SVG</h1>
        <h2>Exemplo de Gráfico!</h2>
        <svg id="grafico" width="500" height="300"></svg>
    </body>
</html>
